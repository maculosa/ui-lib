name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # 推送 version commit 与 git tag
  pull-requests: write # 创建/更新 Version Packages PR

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # changesets 需要完整历史来计算变更
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # 版本按 package.json 的 packageManager 字段

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Create Release PR / Publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          release: pnpm run release:only # changeset publish --registry=https://registry.npmjs.org/
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node 生成的 .npmrc 引用 ${NODE_AUTH_TOKEN}，npm 只认这个名字
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
