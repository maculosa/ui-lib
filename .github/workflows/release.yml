name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # 用于创建 PR 和提交
  pull-requests: write # 用于创建 PR
  id-token: write # 必须！用于 OIDC 认证[reference:17]

jobs:
  # 这个 job 负责创建/更新 "Version Packages" PR
  version:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x # 确保版本 >= 22.14.0[reference:19]

      - name: Install Dependencies
        run: npm ci # 或 pnpm install / yarn install

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          # 此命令会更新版本和 changelog，并提交 PR
          version: npm run version-packages # 对应 package.json 中的脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 这个 job 负责在 PR 合并后发布
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # 确保 version job 成功，并且只在 main 分支运行
    if: github.ref == 'refs/heads/main'
    needs: version
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build:lib # 如果有构建步骤

      # 关键：使用 changesets 的 publish 命令发布
      - name: Publish to npm
        run: npm run release # 对应 package.json 中的 "release": "changeset publish"
        env:
          # 不再需要 NPM_TOKEN！
          # npm 会自动通过 OIDC 进行身份验证[reference:20]
          NODE_AUTH_TOKEN: '' # 可以留空，或为了兼容性保留
